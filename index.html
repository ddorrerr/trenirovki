<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1110" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent: в установленном приложении страница занимает весь
         экран (часы поверх), высота вьюпорта совпадает с экраном — иначе iOS
         считает вьюпорт выше экрана и нижняя навигация уезжает за край -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Workouts" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <title>Тренировки</title>
    <style>
      html { background: #f4f6f5; }
      @media (prefers-color-scheme: dark) { html { background: #0d1110; } }
      html[data-theme="light"] { background: #f4f6f5; }
      html[data-theme="dark"] { background: #0d1110; }
    </style>
    <script>
      // Тема и язык из настроек — до загрузки приложения, чтобы не мигало
      try {
        var ui = JSON.parse(localStorage.getItem('trenirovki:ui:v1') || '{}');
        if (ui.theme === 'light' || ui.theme === 'dark') document.documentElement.dataset.theme = ui.theme;
        if (ui.lang === 'en') {
          document.documentElement.lang = 'en';
          document.title = 'Workouts';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
